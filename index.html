<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>产品收藏 · 手机访问测试</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f5;color:#19382f;font:16px system-ui,-apple-system,"Microsoft YaHei",sans-serif}main{max-width:900px;margin:auto;padding:30px 18px}small{color:#638476}h1{font-size:28px;margin:16px 0 10px}p{line-height:1.8;color:#75877e}.notice{padding:16px;background:#e3f3eb;border:1px solid #cae6d6;border-radius:12px}input{width:100%;padding:14px;border:1px solid #d8e3dc;border-radius:10px;font:inherit;margin:14px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}button{font:inherit;cursor:pointer;border:1px solid #dce6df;background:white;border-radius:8px;padding:10px 15px;color:inherit}.tabs .active{background:#148975;color:white;border-color:#148975}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{padding:0;overflow:hidden;text-align:left}.picture{height:150px;display:grid;place-items:center;background:#eaf2ee;font-size:55px}.body{padding:15px}.body h2{font-size:16px}.body small{font-size:12px}.count{font-size:13px}dialog{border:0;padding:25px;border-radius:15px;width:min(420px,90vw);color:#19382f}dialog::backdrop{background:#12372a77}dialog button{width:100%}footer{font-size:12px;color:#8c9b92;margin-top:30px;line-height:1.8}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.picture{height:135px}}</style></head><body><main><small>PRODUCT LIBRARY · 访问测试</small><h1>手机能打开，就从这里开始。</h1><p class="notice">如果你看到了这段文字，说明页面已加载。再试试搜索、分类和点击产品卡片。</p><p>这是公开测试页，仅包含 6 款虚构示例，没有上传你的产品资料。</p><input id="search" placeholder="搜索示例产品" aria-label="搜索示例产品"><div class="tabs"><button class="active" data-cat="">全部</button><button data-cat="家居日用">家居日用</button><button data-cat="厨房用品">厨房用品</button><button data-cat="数码配件">数码配件</button></div><p id="count" class="count" aria-live="polite"></p><div id="grid" class="grid"></div><footer>无需登录 · 无外部字体或图片依赖<br>测试成功后再决定正式产品资料的发布方式。</footer></main><dialog id="detail"><h2 id="name"></h2><p id="desc"></p><button id="close">关闭详情</button></dialog><script>const rows=[['桌面收纳盒','家居日用','▧'],['便携阅读灯','家居日用','☼'],['厨房计时器','厨房用品','◷'],['硅胶隔热垫','厨房用品','▦'],['折叠手机支架','数码配件','◇'],['线材收纳扣','数码配件','⌁']];let cat='';const $=s=>document.querySelector(s);function render(){const q=$('#search').value.trim();const list=rows.filter(r=>(!cat||r[1]===cat)&&(!q||r[0].includes(q)));$('#count').textContent='共 '+list.length+' 款示例产品';$('#grid').innerHTML=list.map(r=>'<button class="card" data-name="'+r[0]+'"><div class="picture">'+r[2]+'</div><div class="body"><small>'+r[1]+'</small><h2>'+r[0]+'</h2></div></button>').join('')||'<p>没有找到匹配产品</p>'}$('#search').oninput=render;document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));render()});$('#grid').onclick=e=>{const b=e.target.closest('[data-name]');if(!b)return;$('#name').textContent=b.dataset.name;$('#desc').textContent='产品详情打开成功，网页交互正常。这是用于手机访问测试的虚构示例。';$('#detail').showModal()};$('#close').onclick=()=>$('#detail').close();render();</script></body></html>
